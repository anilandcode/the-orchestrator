name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tests are excluded from the package configs so they never reach dist, which meant they
      # were never typechecked at all: vitest strips types via esbuild without checking them.
      - run: pnpm typecheck:tests
      - run: pnpm lint
      # No provider keys are set here on purpose: every test must pass offline.
      - run: pnpm test
      - run: pnpm replay:simulate
